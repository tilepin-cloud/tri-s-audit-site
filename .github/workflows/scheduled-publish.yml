# Posts with a future `date` are excluded from production builds. This workflow redeploys every morning
# (Tashkent 09:00 = 04:00 UTC) so a scheduled post appears on its day without a manual push.
# It triggers the Cloudflare Workers Builds deploy hook stored in the repository secret CF_DEPLOY_HOOK.
name: Scheduled publish

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    # The secrets context is not available in `if:`, so the hook is mapped to env here and the step tests env.
    env:
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
    steps:
      - name: Trigger the hosting build
        if: ${{ env.CF_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$CF_DEPLOY_HOOK"
